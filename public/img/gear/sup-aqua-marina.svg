  <ellipse cx="540" cy="510" rx="24" ry="12" fill="#ffffff" transform="rotate(30 540 510)"/>
  <!-- Text Badge -->
  <rect x="40" y="40" width="220" height="42" rx="21" fill="rgba(0,0,0,0.6)" stroke="rgba(255,255,255,0.2)"/>
  <text x="150" y="66" font-family="system-ui, sans-serif" font-size="16" font-weight="bold" fill="#ffffff" text-anchor="middle">Aqua Marina Beast 10'6"</text>
