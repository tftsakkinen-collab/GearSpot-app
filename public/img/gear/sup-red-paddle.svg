<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600">
  <defs>
    <linearGradient id="skyGrad2" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#122a36"/>
      <stop offset="60%" stop-color="#1e4558"/>
      <stop offset="100%" stop-color="#2b6b88"/>
    </linearGradient>
    <linearGradient id="boardGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#dc2626"/>
      <stop offset="100%" stop-color="#991b1b"/>
    </linearGradient>
  </defs>
  <rect width="800" height="600" fill="url(#skyGrad2)"/>
  <!-- Water -->
  <rect y="360" width="800" height="240" fill="#0d2836"/>
  <path d="M 0 400 Q 250 380 500 400 T 800 400" stroke="#38bdf8" stroke-width="3" fill="none" opacity="0.3"/>
  <path d="M 0 450 Q 250 430 500 450 T 800 450" stroke="#38bdf8" stroke-width="2" fill="none" opacity="0.2"/>
  <!-- SUP Board graphic -->
  <ellipse cx="400" cy="480" rx="230" ry="34" fill="url(#boardGrad2)" stroke="#f87171" stroke-width="4"/>
  <ellipse cx="400" cy="480" rx="150" ry="20" fill="#7f1d1d"/>
  <!-- Paddle -->
  <line x1="260" y1="340" x2="540" y2="500" stroke="#fef08a" stroke-width="6" stroke-linecap="round"/>
  <ellipse cx="550" cy="505" rx="24" ry="12" fill="#fef08a" transform="rotate(30 550 505)"/>
  <!-- Text Badge -->
  <rect x="40" y="40" width="240" height="42" rx="21" fill="rgba(0,0,0,0.6)" stroke="rgba(255,255,255,0.2)"/>
  <text x="160" y="66" font-family="system-ui, sans-serif" font-size="16" font-weight="bold" fill="#ffffff" text-anchor="middle">Red Paddle Co Ride 10'6"</text>
</svg>
