<!doctype html>
<html lang="fi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sivua ei löytynyt (404) — Vuokraajanne</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <style>
      :root {
        --bg: #f8fafc;
        --text: #0f172a;
        --accent: #059669;
        --muted: #64748b;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #0f172a;
          --text: #f8fafc;
          --muted: #94a3b8;
        }
      }
      body {
        margin: 0;
        padding: 0;
        font-family: system-ui, -apple-system, sans-serif;
        background-color: var(--bg);
        color: var(--text);
        display: flex;
        align-items: center;
        justify-content: center;
        min-height: 100vh;
        text-align: center;
      }
      .container {
        max-width: 480px;
        padding: 2rem;
      }
      h1 {
        font-size: 5rem;
        margin: 0;
        color: var(--accent);
        line-height: 1;
      }
      h2 {
        font-size: 1.5rem;
        margin: 1rem 0 0.5rem;
      }
      p {
        color: var(--muted);
        font-size: 0.95rem;
        margin-bottom: 2rem;
      }
      .btn {
        display: inline-block;
        background-color: var(--accent);
        color: #ffffff;
        text-decoration: none;
        padding: 0.8rem 1.75rem;
        border-radius: 999px;
        font-weight: 600;
        font-size: 0.9rem;
        transition: opacity 0.2s;
      }
      .btn:hover {
        opacity: 0.9;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <h1>404</h1>
      <h2>Sivua ei löytynyt</h2>
      <p>Etsimääsi sivua ei ole olemassa tai se on siirretty toiseen osoitteeseen.</p>
      <a href="/" class="btn">Palaa etusivulle</a>
    </div>
  </body>
</html>
